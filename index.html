<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="body">
        <div>
            <h1>Tip Calculator</h1>
        </div>

        <section>
            <label for="billAmount">Bill Amount</label>
            <input type="text" placeholder="N0.00" id="billAmount">

            <p id="tip-text">Tip</p>
            <div id="percent-buttons">
                <button>10%</button>
                <button>15%</button>
                <button>20%</button>
            </div>

            <label for="num-of-friends">Number of Friends</label>
            <input type="number" id="num-of-friends">
        </section>

        <section>
            <div>
                <button>Split</button>    
            </div>
            <div>
                SPIN
            </div>
        </section>
        </div>
    <script src="script.js"></script>
</body>
</html>
