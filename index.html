<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="body">
        <div id="title">
            <h1>Tip Calculator</h1>
        </div>

        <section id="inputs">
            <label for="billAmount">Bill Amount</label>
            <input type="number" placeholder="N0.00" id="billAmount">
            <br>
            <p id="tip-text">Tip</p>
            <div id="percent-buttons">
                <button class="percent">10%</button>
                <button class="percent">15%</button>
                <button class="percent">20%</button>
            </div>
            <br>

            <label for="num-of-friends">Number of Friends</label>
            <input type="number" id="num-of-friends">
        </section>

        <section id = "split-or-spin">
            <div>
                <button id="split-btn">Split</button>    
            </div>
            <div id="or">OR</div>
            <div>
                <button id="spin-btn">Spin</button>
            </div>
        </section>
        
      
        <div id="split-bill">
            <div id="tip-amount"></div>
        </div>

        <div id="spin">
        </div>
        </div>
    <script src="script.js"></script>
</body>
</html>
