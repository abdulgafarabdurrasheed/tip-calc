<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIP CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="body">
        <div id="title">
            <h1>Tip Calculator</h1>
        </div>
        <div id="bill">
            
        </div>
        <div id="input-spin-flex">
            <div id="inputs">
                <label for="billAmount">Bill Amount</label>
                <input type="number" placeholder="Enter bill amount" id="billAmount">
                <br>
                <p id="tip-text">Tip</p>
                <div id="percent-buttons">
                    <button class="percent">10%</button>
                    <button class="percent">15%</button>
                    <button class="percent">20%</button>
                </div>
                <br>
                <label for="num-of-friends">Number of Friends</label>
                <input type="number" id="num-of-friends" placeholder="Enter number of friends">
                <section id = "split-or-spin">
                    
                    <button id="split-btn">Split</button>    
                    <div id="or">OR</div>
                    <button id="spin-btn">Spin</button>
                </section>    
            </div>
            <div id="spinwheel-arrow-flex">
                <div id="spin">Tap "split" to share the bill or "spin" to pick a friend to pay</div>
                <div id="arrow">⬇️</div>
            </div>
            
        </div>
        <section id="payment-status">
            <p id="payment-message"></p>
        </section>
        <section id="last-section">
            <p id="tip-amount">Tip:</p>
            <p id="total-amount">Total:</p>
        </section>

        
        <!-- <div>
            <p id="instruction">Tap "split" to share the bill or "spin" to pick a friend to pay</p>
        </div> -->


        </div>
    <script src="script.js"></script>
</body>
</html>
